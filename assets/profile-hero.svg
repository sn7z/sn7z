<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Syed Numaan — AI/ML Engineer</title>
  <desc id="desc">Animated emerald and amber hero banner with a technical grid and glowing data lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0d"/>
      <stop offset="0.55" stop-color="#0d1210"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d1d5db" stroke-opacity=".09"/>
      <circle cx="0" cy="0" r="1.5" fill="#34d399" fill-opacity=".26"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="394" rx="26"/></clipPath>
  </defs>
  <rect width="1200" height="430" rx="30" fill="#0b0f0d"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1164" height="394" fill="url(#bg)"/>
    <rect x="18" y="18" width="1164" height="394" fill="url(#grid)"/>
    <circle cx="1020" cy="74" r="190" fill="#059669" fill-opacity=".12" filter="url(#glow)"/>
    <circle cx="1080" cy="340" r="150" fill="#fbbf24" fill-opacity=".08" filter="url(#glow)"/>
    <path d="M-50 330C180 270 250 410 470 328S760 190 940 270s200 2 320-66" fill="none" stroke="url(#accent)" stroke-opacity=".20" stroke-width="2"/>
    <path d="M-50 340C180 280 250 420 470 338S760 200 940 280s200 2 320-66" fill="none" stroke="url(#accent)" stroke-opacity=".85" stroke-width="1.5" stroke-dasharray="8 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M760 18V412M928 18V412M1096 18V412" stroke="#34d399" stroke-opacity=".13" stroke-dasharray="3 12"/>
    <circle cx="760" cy="188" r="4" fill="#34d399" filter="url(#glow)">
      <animate attributeName="cy" values="188;270;188" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="928" cy="278" r="4" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="cy" values="278;120;278" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text x="86" y="112" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3">HELLO, I'M @SN7Z</text>
    <text x="82" y="206" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">Syed <tspan fill="url(#accent)">Numaan</tspan></text>
    <rect x="86" y="236" width="94" height="4" rx="2" fill="url(#accent)"/>
    <text x="86" y="286" fill="#d1d5db" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="600">AI/ML Engineer · Applied AI &amp; Generative AI</text>
    <text x="86" y="324" fill="#9ca3af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Building practical systems from model to interface.</text>
    <g transform="translate(86 365)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <rect width="226" height="28" rx="14" fill="#0d1210" stroke="#34d399" stroke-opacity=".55"/>
      <circle cx="18" cy="14" r="4" fill="#34d399"/>
      <text x="32" y="19" fill="#d1d5db">HYDERABAD · INDIA</text>
    </g>
  </g>
  <rect x="18.5" y="18.5" width="1163" height="393" rx="25.5" fill="none" stroke="url(#accent)" stroke-opacity=".65"/>
</svg>
