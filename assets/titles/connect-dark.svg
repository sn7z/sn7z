<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 112" width="960" height="112" role="img" aria-label="WEB PRESENCE &#8212; DEV NETWORK!">
  <title>WEB PRESENCE &#8212; DEV NETWORK!</title>
  <defs>
