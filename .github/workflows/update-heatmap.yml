name: Update contribution heatmap

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate heatmap from GitHub contributions API
        run: python3 .github/scripts/gen-heatmap.py

      - name: Commit updated heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-dark.svg assets/heatmap-light.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh contribution heatmap"
            git push
          fi
