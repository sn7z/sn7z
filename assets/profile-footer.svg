<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Keep building, keep learning.</title>
  <desc id="desc">Animated emerald and amber footer with a technical horizon.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset=".5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d1d5db" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="170" rx="26" fill="#0b0f0d"/>
  <rect x="1" y="1" width="1198" height="168" rx="25" fill="url(#grid)"/>
  <path d="M0 126C180 90 280 150 430 116s220-45 360-4 250 10 410-34" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="178" cy="96" r="3" fill="#34d399" filter="url(#glow)"/>
  <circle cx="1022" cy="82" r="3" fill="#fbbf24" filter="url(#glow)"/>
  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Keep building. Keep learning.</text>
  <text x="600" y="101" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">ideas → experiments → useful systems</text>
  <rect x="1" y="1" width="1198" height="168" rx="25" fill="none" stroke="url(#line)" stroke-opacity=".7"/>
</svg>
