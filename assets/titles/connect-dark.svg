      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tltdf_connect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge>
