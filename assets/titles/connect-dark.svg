    <circle cx="88" cy="26" r="1.1" fill="#8ff5cf"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="86" r="0.9" fill="#8ff5cf"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.0" fill="#8ff5cf"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.0s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
